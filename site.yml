---
# kali-setup: my Kali setup. Run through bootstrap.sh, which installs the pinned Ansible and
# passes target_user. Safe to re-run; --check --diff shows what would change.
# Tags pick parts: sudo apt_repos packages_base packages_extra thirdparty go awscli fonts shell
# terminator pyenv nvm pipx desktop.
- name: Set up this Kali machine
  hosts: localhost
  become: true
  pre_tasks:
    - name: Refuse to run without a normal target user
      ansible.builtin.assert:
        that:
          - target_user | length > 0
          - target_user != 'root'
        fail_msg: Pass -e target_user=<name> (bootstrap.sh does this). Setting up root isn't supported.
        quiet: true
      tags: [always]

    - name: Look up the target user
      ansible.builtin.getent:
        database: passwd
        key: "{{ target_user }}"
      tags: [always]

    - name: Remember the target user's home
      ansible.builtin.set_fact:
        target_home: "{{ ansible_facts.getent_passwd[target_user][4] }}"
      tags: [always]
  roles:
    - role: base
    - role: apt_repos
      tags: [apt_repos]
    - role: packages
    - role: runtimes
    - role: shell
    - role: pipx_tools
      tags: [pipx]
    - role: desktop
      tags: [desktop]
