---
# RDP (xrdp) into the user's XFCE session, and Tailscale. Joining the tailnet stays manual:
# `sudo tailscale up` on each machine (no auth key in the repo or the images).
# xrdp listens on every interface, and the images keep the kali:kali login: accepted by the owner
# on 2026-09-28. Anyone who can reach port 3389 can try that login.
- name: Install xrdp
  ansible.builtin.apt:
    name: "{{ packages_rdp }}"
    state: present
  tags: [rdp]

# xrdp reads the TLS key in /etc/ssl/private, which is group ssl-cert.
- name: Let xrdp read its TLS key
  ansible.builtin.user:
    name: xrdp
    groups: ssl-cert
    append: true
  tags: [rdp]

# Kali ships network services DISABLED by default (its network-service policy), so installing
# the packages doesn't enable them: enable them explicitly. On a booted system, also start them.
# An image build's chroot or a container has no running systemd; ansible's is_chroot fact doesn't
# see debos's chroot, so use systemd's own test (sd_booted): /run/systemd/system exists.
- name: Is systemd running?
  ansible.builtin.stat:
    path: /run/systemd/system
  register: remote_access_systemd
  tags: [rdp, tailscale]

- name: Enable and start xrdp and tailscaled
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [xrdp, tailscaled]
  when: remote_access_systemd.stat.isdir | default(false)
  tags: [rdp, tailscale]

# Offline (image build): systemctl enable only creates the wants/ symlinks, which works without a
# running systemd. Containers without systemd at all skip this.
- name: Is systemctl installed?
  ansible.builtin.stat:
    path: /usr/bin/systemctl
  register: remote_access_systemctl
  tags: [rdp, tailscale]

# noqa below: the systemd module can't enable units without a running systemd; this must work
# offline in the image build's chroot.
- name: Enable xrdp and tailscaled for the next boot (image build)
  ansible.builtin.command: systemctl enable xrdp tailscaled  # noqa: command-instead-of-module
  register: remote_access_enable
  changed_when: "'Created symlink' in (remote_access_enable.stdout ~ remote_access_enable.stderr)"
  when:
    - not (remote_access_systemd.stat.isdir | default(false))
    - remote_access_systemctl.stat.exists
  tags: [rdp, tailscale]
