---
# My XFCE panel (configs/panel.tar.bz2). When the profile is new or changed, the handler applies
# it: straight away inside a desktop session (bootstrap.sh passes DISPLAY and the D-Bus address),
# otherwise (image build, SSH) through a one-shot autostart entry at the next login.
- name: First-login script (used when there's no desktop session)
  ansible.builtin.copy:
    dest: /usr/local/bin/kali-setup-first-login
    mode: "0755"
    content: |
      #!/bin/bash
      # kali-setup: load the XFCE panel once at first login, then remove the autostart entry.
      xfce4-panel-profiles load "$HOME/.config/kali-setup/panel.tar.bz2" && \
          rm -f "$HOME/.config/autostart/kali-setup-first-login.desktop"

- name: Panel profile
  become: true
  become_user: "{{ target_user }}"
  block:
    - name: Panel profile directories
      ansible.builtin.file:
        path: "{{ target_home }}/.config/{{ item }}"
        state: directory
        mode: "0755"
      loop: [kali-setup, autostart]

    - name: Panel profile
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/configs/panel.tar.bz2"
        dest: "{{ target_home }}/.config/kali-setup/panel.tar.bz2"
        mode: "0644"
      notify: Apply the panel profile
